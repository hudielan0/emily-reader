<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emily阅读</title>
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <section id="empty" class="empty" hidden><!-- shown by main.js when there is no saved book -->
    <div class="logo">📚</div>
    <h1>Emily阅读</h1>
    <p>选一本电脑上的 EPUB 文件开始阅读。</p>
    <label class="primary">选择 EPUB 文件<input type="file" accept=".epub,application/epub+zip" data-file hidden></label>
  </section>

  <section id="reading" class="reading" hidden>
    <div class="spread"><div id="viewer"></div></div>
    <div class="dock">
      <button id="toc-btn" title="目录">☰ 目录</button>
      <button id="back" title="回到跳转前的位置" hidden>↩ 返回</button>
      <button id="prev" title="上一页（←）">◀</button>
      <input id="progress" type="range" min="0" max="1000" value="0" disabled title="正在计算全书进度…" aria-label="全书进度">
      <button id="next" title="下一页（→）">▶</button>
      <span id="where" class="where"></span>
      <label class="btn">换书<input type="file" accept=".epub,application/epub+zip" data-file hidden></label>
    </div>
    <div id="scrim" class="scrim" hidden></div>
    <nav id="toc" class="toc-panel" aria-label="目录" hidden>
      <div class="panel-head"><b>目录</b><button id="toc-close" class="icon" title="关闭（Esc）">✕</button></div>
      <ol id="toc-list"></ol>
    </nav>
  </section>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="查看大图" hidden>
    <button id="lightbox-close" class="lightbox-close" title="关闭（Esc）">✕</button>
    <figure>
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <div id="error" class="error" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
